[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "runsift"
version = "0.1.0"
description = "RunSift: local synthetic developer workflow tooling"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
runsift = "runsift:main"

[tool.setuptools]
py-modules = ["runsift"]
